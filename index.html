<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Parkour Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: #eee;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        #ui {
            display: flex;
            gap: 30px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        #ui span {
            color: #0f3460;
            background: #16213e;
            padding: 4px 14px;
            border-radius: 6px;
            border: 1px solid #0f3460;
        }
        #ui span b {
            color: #e94560;
        }
        canvas {
            border: 2px solid #0f3460;
            border-radius: 4px;
            background: #16213e;
            box-shadow: 0 0 30px rgba(14, 52, 96, 0.6);
        }
        #instructions {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
        }
        #instructions span {
            background: #0f3460;
            padding: 2px 8px;
            border-radius: 4px;
            color: #e94560;
            font-weight: bold;
        }
        #overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(22, 33, 62, 0.92);
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 30px 50px;
            text-align: center;
        }
        #overlay h2 {
            font-size: 2rem;
            color: #e94560;
            margin-bottom: 10px;
        }
        #overlay p {
            margin-bottom: 20px;
            color: #ccc;
            font-size: 1rem;
        }
        #overlay button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #overlay button:hover {
            background: #c73652;
        }
        #game-container {
            position: relative;
        }
    </style>
</head>
<body>
    <h1>🏃 Simple Parkour Game</h1>
    <div id="ui">
        <span>Score: <b id="score">0</b></span>
        <span>Best: <b id="best">0</b></span>
        <span>Level: <b id="level">1</b></span>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="overlay">
            <h2>Simple Parkour</h2>
            <p>Jump over obstacles and reach platforms!<br>Collect coins for bonus points.</p>
            <button id="startBtn">▶ Start Game</button>
        </div>
    </div>
    <div id="instructions">
        <span>Space</span> or <span>↑</span> to Jump &nbsp;|&nbsp;
        <span>←</span> <span>→</span> to Move &nbsp;|&nbsp;
        Double-jump allowed!
    </div>
    <script src="game.js"></script>
</body>
</html>
