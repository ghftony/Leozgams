{% extends "base.html" %}
{% block title %}Delete {{ object_type }} – SC Portal{% endblock %}
{% block content %}

<!--begin::Page title-->
<div class="mb-7">
  <h1 class="page-heading d-flex text-gray-900 fw-bolder fs-3 flex-column justify-content-center m-0">
    Delete {{ object_type }}
  </h1>
</div>
<!--end::Page title-->

<div class="card card-flush" style="max-width: 520px;">
  <div class="card-body pt-6">
    <div class="notice d-flex bg-light-danger rounded border-danger border border-dashed mb-6 p-6">
      <i class="ki-outline ki-information-5 fs-2tx text-danger me-4"></i>
      <div class="d-flex flex-stack flex-grow-1">
        <div class="fw-semibold">
          <div class="text-gray-700 fs-6">
            Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.
          </div>
        </div>
      </div>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-danger">
          <i class="ki-outline ki-trash fs-4 me-1"></i>Yes, delete
        </button>
        <a href="{{ cancel_url }}" class="btn btn-light">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
