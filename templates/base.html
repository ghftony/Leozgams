{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Parkour Game{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
  <link href="{% static 'assets/plugins/global/plugins.bundle.css' %}" rel="stylesheet" />
  <link href="{% static 'assets/css/style.bundle.css' %}" rel="stylesheet" />
  {% block extra_css %}{% endblock %}
  <style>
    /* ── Game Launcher ─────────────────────────────────────────── */
    #launcher-btn {
      background: none;
      border: none;
      padding: 6px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #launcher-btn:hover { background: rgba(0,0,0,0.08); }
    #launcher-btn svg { display: block; }

    #launcher-popup {
      display: none;
      position: fixed;
      top: 60px;
      left: 12px;
      z-index: 9999;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      padding: 16px 12px 12px;
      width: 220px;
    }
    #launcher-popup.open { display: block; }

    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }
    .launcher-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 8px;
      border-radius: 10px;
      text-decoration: none;
      color: #3f4254;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .launcher-item:hover {
      background: #f1f3f9;
      color: #3f4254;
      text-decoration: none;
    }
    .launcher-item .li-icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .launcher-item .li-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body id="kt_app_body"
  data-kt-app-header-fixed="true"
  data-kt-app-header-fixed-mobile="true"
  class="app-default">

  <script>
    var defaultThemeMode = "light";
    var themeMode;
    if (document.documentElement) {
      if (document.documentElement.hasAttribute("data-bs-theme-mode")) {
        themeMode = document.documentElement.getAttribute("data-bs-theme-mode");
      } else {
        themeMode = localStorage.getItem("data-bs-theme") || defaultThemeMode;
      }
      if (themeMode === "system") {
        themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", themeMode);
    }
  </script>

  <!-- Game launcher popup -->
  <div id="launcher-popup">
    <div class="launcher-grid">
      <a class="launcher-item" href="{% url 'parkour_game' %}">
        <div class="li-icon">
          <!-- Parkour: character jumping between two platforms -->
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sky background -->
            <rect width="64" height="64" fill="#e8f0fe" rx="14"/>
            <!-- Left lower platform -->
            <rect x="2" y="50" width="20" height="7" rx="3" fill="#1a73e8"/>
            <!-- Right upper platform -->
            <rect x="42" y="36" width="20" height="7" rx="3" fill="#1a73e8"/>
            <!-- Speed lines (left of character) -->
            <line x1="13" y1="28" x2="5"  y2="28" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
            <line x1="13" y1="32" x2="6"  y2="32" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round" opacity="0.28"/>
            <line x1="13" y1="24" x2="7"  y2="24" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round" opacity="0.20"/>
            <!-- Character mid-jump (leaning right toward higher platform) -->
            <!-- Head -->
            <circle cx="32" cy="13" r="6" fill="#FF7043"/>
            <!-- Torso (slight forward lean) -->
            <line x1="31" y1="19" x2="29" y2="31" stroke="#FF7043" stroke-width="5" stroke-linecap="round"/>
            <!-- Leading arm (right, reaching forward/up) -->
            <line x1="30" y1="23" x2="42" y2="18" stroke="#FF7043" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Trailing arm (left, back) -->
            <line x1="30" y1="23" x2="19" y2="27" stroke="#FF7043" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Leading leg (right, forward) -->
            <line x1="29" y1="31" x2="38" y2="42" stroke="#FF7043" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Trailing leg (left, back and bent) -->
            <line x1="29" y1="31" x2="20" y2="38" stroke="#FF7043" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
        </div>
        Parkour
      </a>
      <a class="launcher-item" href="{% url 'fishing_portal' %}">
        <div class="li-icon">
          <!-- Fishing: person sitting on bank, rod out over water, fish visible -->
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sky -->
            <rect width="64" height="64" fill="#e3f2fd" rx="14"/>
            <!-- Water -->
            <rect x="28" y="36" width="36" height="28" fill="#90caf9" rx="0"/>
            <!-- Water surface wave -->
            <path d="M28 37 Q38 33 48 37 Q56 41 64 37" stroke="#1565C0" stroke-width="1.5" fill="none"/>
            <!-- Ground / bank -->
            <rect x="0" y="42" width="34" height="22" fill="#6D4C41"/>
            <rect x="0" y="40" width="34" height="5" rx="2" fill="#8D6E63"/>
            <!-- Fishing line -->
            <line x1="56" y1="9" x2="50" y2="37" stroke="#78909C" stroke-width="1"/>
            <!-- Bobber -->
            <circle cx="50" cy="37" r="3" fill="#E53935"/>
            <circle cx="50" cy="35.5" r="1.5" fill="#ffffff" opacity="0.6"/>
            <!-- Fish underwater -->
            <ellipse cx="46" cy="50" rx="8" ry="4.5" fill="#29B6F6"/>
            <path d="M54 50 L62 45 L62 55 Z" fill="#29B6F6"/>
            <circle cx="42" cy="49" r="1.5" fill="white"/>
            <circle cx="42.5" cy="49" r="0.7" fill="#1565C0"/>
            <!-- Rod -->
            <line x1="22" y1="28" x2="56" y2="9" stroke="#5D4037" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Person sitting on bank -->
            <!-- Head -->
            <circle cx="13" cy="20" r="6.5" fill="#FFAB40"/>
            <!-- Body -->
            <rect x="9" y="26" width="9" height="12" rx="3" fill="#1565C0"/>
            <!-- Arm holding rod -->
            <line x1="18" y1="30" x2="22" y2="28" stroke="#FFAB40" stroke-width="3" stroke-linecap="round"/>
            <!-- Legs (sitting, dangling off bank edge) -->
            <line x1="11" y1="38" x2="7"  y2="46" stroke="#1565C0" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="16" y1="38" x2="22" y2="46" stroke="#1565C0" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
        </div>
        Fishing
      </a>
    </div>
  </div>

  <div class="d-flex flex-column flex-root app-root" id="kt_app_root">
    <div class="app-page flex-column flex-column-fluid" id="kt_app_page">

      <!--begin::Header-->
      <div id="kt_app_header" class="app-header">
        <div class="app-container container-fluid d-flex align-items-stretch justify-content-between" id="kt_app_header_container">

          <!--begin::Logo-->
          <div class="app-header-logo d-flex align-items-center me-5">
            <!-- Dots launcher button -->
            <button id="launcher-btn" aria-label="Open game menu" title="Games">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="3.5"  cy="3.5"  r="2" fill="#5E6278"/>
                <circle cx="10"   cy="3.5"  r="2" fill="#5E6278"/>
                <circle cx="16.5" cy="3.5"  r="2" fill="#5E6278"/>
                <circle cx="3.5"  cy="10"   r="2" fill="#5E6278"/>
                <circle cx="10"   cy="10"   r="2" fill="#5E6278"/>
                <circle cx="16.5" cy="10"   r="2" fill="#5E6278"/>
                <circle cx="3.5"  cy="16.5" r="2" fill="#5E6278"/>
                <circle cx="10"   cy="16.5" r="2" fill="#5E6278"/>
                <circle cx="16.5" cy="16.5" r="2" fill="#5E6278"/>
              </svg>
            </button>

            <a href="{% url 'parkour_game' %}" class="d-flex align-items-center gap-2 ms-3">
              <i class="ki-outline ki-rocket text-primary fs-1"></i>
              <span class="text-gray-900 fw-bolder fs-4">Parkour</span>
            </a>
          </div>
          <!--end::Logo-->

          <!--begin::Header right-->
          <div class="d-flex align-items-stretch justify-content-end flex-lg-grow-1">
          </div>
          <!--end::Header right-->

        </div>
      </div>
      <!--end::Header-->

      <!--begin::Wrapper-->
      <div class="app-wrapper d-flex flex-column flex-column-fluid" id="kt_app_wrapper">
        <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
          <div class="d-flex flex-column flex-column-fluid">

            <!--begin::Content-->
            <div id="kt_app_content" class="app-content flex-column-fluid px-5 px-lg-10 pt-5 pt-lg-10 pb-10">
              {% block content %}{% endblock %}
            </div>
            <!--end::Content-->

          </div>
        </div>
      </div>
      <!--end::Wrapper-->

    </div>
  </div>

  <script src="{% static 'assets/plugins/global/plugins.bundle.js' %}"></script>
  <script src="{% static 'assets/js/scripts.bundle.js' %}"></script>
  <script>
    (function () {
      const btn = document.getElementById('launcher-btn');
      const popup = document.getElementById('launcher-popup');

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        popup.classList.toggle('open');
      });

      document.addEventListener('click', function (e) {
        if (!popup.contains(e.target)) {
          popup.classList.remove('open');
        }
      });
    })();
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
